name: Release Please

on:
  workflow_call:
    inputs:
      auto-merge:
        default: true
        description:
          Whether to merge the release pull requests that are open at the end of
          this run, whether or not this run is what opened them, once their
          checks finish and if nothing their changelog would list has landed
          since they were computed. A caller that batches its releases passes
          true only on the run that is meant to merge.
        required: false
        type: boolean
      dry-run:
        default: false
        description:
          Run release-please without opening a pull request or cutting a
          release. Exists so that this workflow can be exercised on a pull
          request, where a real run would otherwise write to the repository. Not
          something a release caller should set.
        required: false
        type: boolean
    outputs:
      paths_released:
        description: JSON array of the paths that had a release created.
        value: ${{ jobs.propose.outputs.paths_released }}
      prs:
        description: JSON array of the release pull requests opened or updated.
        value: ${{ jobs.propose.outputs.prs }}
      release_created:
        description:
          Whether a release was created for the root component. Empty in
          repositories that have no component at the repository root.
        value: ${{ jobs.propose.outputs.release_created }}
      releases_created:
        description: Whether any release was created.
        value: ${{ jobs.propose.outputs.releases_created }}
      tag_name:
        description: Tag the root component's release was cut at.
        value: ${{ jobs.propose.outputs.tag_name }}
      version:
        description: Full semver version of the root component's release.
        value: ${{ jobs.propose.outputs.version }}
    secrets:
      client-id:
        description:
          Client ID of a GitHub App installed on the calling repository. Supply
          this together with private-key. Without both, the run falls back to
          GITHUB_TOKEN and the release pull requests it opens will not start any
          workflow runs.
        required: false
      private-key:
        description: Private key of the GitHub App named above.
        required: false

# Deliberately no concurrency block, and the caller has to carry one instead.
# Overlapping release-please runs race each other, so the guard is not optional
# — but GitHub documents concurrency at the caller, and says nothing either way
# about a group declared in a called workflow. A guard that only matters during
# a rare race is the worst possible place to rely on undocumented behaviour: if
# it silently did nothing here, every consumer would lose it at once and none
# of them would find out until the race actually happened. At the caller it is
# supported, it is visible in review, and forgetting it costs one repository
# rather than all of them. README.md carries the block to copy.

# Deliberately no permissions block. The caller grants what its token needs,
# and that differs: a repository using the application token below can leave
# GITHUB_TOKEN on contents: read, while one falling back to it needs contents,
# issues and pull-requests at write. Declaring write here would fail the run
# for the first kind rather than let it keep the tighter grant.

jobs:
  propose:
    name: Propose releases
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs: ${{ steps.release.outputs.prs }}
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    env:
      # The secrets context is not available to a step's if condition, so the
      # presence check has to read the value through env instead.
      CLIENT_ID: ${{ secrets.client-id }}
    steps:
      # Pull requests opened with the default GITHUB_TOKEN do not start
      # workflow runs. Their checks sit at action_required until somebody
      # approves them by hand, so a release stalls until then. Requests made
      # with an application token trigger the checks like any other.
      - name: Mint an application token
        id: app-token
        if: env.CLIENT_ID != ''
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.client-id }}
          private-key: ${{ secrets.private-key }}

      - name: Warn that no application token was supplied
        if: env.CLIENT_ID == ''
        run: |
          echo '::warning::No client-id secret was supplied, so this run used GITHUB_TOKEN. Its release pull request will not start any workflow runs, so required checks never report on it, and auto-merge is disabled below because merging it as the token would leave the release half-cut. Merge it yourself — a push by a human does trigger the run that tags it. Installing a GitHub App and passing client-id and private-key removes all of this.'

      # A skipped step's outputs are empty strings, so this falls through to
      # the default token whenever the application token was not minted.
      - name: Propose releases
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          # Both skips together are what make dry-run write nothing: one
          # suppresses the pull request, the other the tag and release. With
          # them set, the step still resolves the config, walks the commits and
          # computes the versions — which is the part worth exercising, and the
          # part a bad bump to this action would break.
          skip-github-pull-request: ${{ inputs.dry-run }}
          skip-github-release: ${{ inputs.dry-run }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      # Requires the application token, not just the auto-merge input. Merging
      # the release pull request is only half of a release: that merge pushes
      # the default branch, and the run it starts is what actually cuts the tag
      # and the GitHub release. A push made with GITHUB_TOKEN starts no run at
      # all, so auto-merging as it strands the release with its version bumped
      # on the branch and nothing tagged — worse than not auto-merging, because
      # the pull request is now closed and there is nothing left to merge by
      # hand. A human's merge does start that run, so the fallback path leaves
      # this to them.
      #
      # This merges directly rather than arming GitHub's auto-merge, because an
      # armed merge cannot refuse a release that has gone stale. It fires when
      # the checks pass, whatever has landed on the branch since release-please
      # computed the pull request, and a push landing mid-run cannot rewrite
      # the pull request in time either: its own run queues behind this one. A
      # user-facing commit then ships inside the tag with no changelog entry,
      # and since release-please counts it as released, no later release lists
      # it. That happened in kanso-labs/home-assistant-applications on
      # 2026-09-18.
      #
      # So this waits for the pull request's checks to finish, then lists the
      # commits on the base branch since the one the pull request was computed
      # from, which is its head's parent: release-please writes the pull
      # request as one commit on top of the branch. If any of them is one the
      # changelog would list, the merge is left for the next run, by when that
      # commit's own run has rewritten the pull request. Otherwise it merges at
      # once, pinned to the head read straight after release-please ran. The
      # gap between the listing and the merge is seconds.
      #
      # "Would list" is release-please's own rule (src/util/filter-commits.ts,
      # release-please 17.6.0): a type its changelog shows, or a breaking
      # change of a type it hides. The types come from the consumer's
      # release-please-config.json, top level and every package, or
      # release-please's defaults when it names none. Every line of a message
      # shaped like a conventional header is read, so a nested commit in a
      # squashed body errs towards waiting a day.
      #
      # Requiring the pull request to be up to date with the branch instead is
      # unsound: release-please does not rewrite it when only hidden types
      # land, so it is routinely behind and would sit BEHIND with nothing to
      # update it.
      #
      # The merge goes through the REST endpoint rather than gh pr merge, which
      # refuses on its own read of mergeStateStatus. GitHub computes that
      # lazily, so straight after the checks finish gh can still read BLOCKED.
      # The endpoint lets the server decide, and a refusal is retried twice in
      # case the server was still settling too.
      #
      # Failing to merge is not worth failing the run over. The release
      # pull request itself is already open and correct, and merging it by hand
      # still works, so this warns and moves on.
      #
      # The pull requests come from the label rather than from the step above,
      # and that is not a tidying choice. release-please's prs output carries
      # only what the run created or updated: when the release it computes has
      # not changed, the action logs "remained the same", drops that pull
      # request, and then sets no prs output at all rather than an empty array.
      # A caller that batches releases — proposing on every push, merging on a
      # daily schedule — lands on that case almost every day, because the last
      # push already wrote the pull request the scheduled run then finds
      # unchanged. Gating on prs there merges nothing, ever, and produces no
      # failing run to say so. The label is what release-please puts on a
      # release pull request regardless of which run last touched it.
      #
      # !inputs.dry-run is load-bearing now. It used to be backed up by prs
      # being empty whenever the pull request was skipped; a label lookup finds
      # the standing release pull request either way, so this condition is the
      # only thing left keeping a dry run from merging a real release.
      - name: Merge the open release pull requests
        if: inputs.auto-merge && !inputs.dry-run && env.CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prs="$(gh pr list --label 'autorelease: pending' --state open --limit 100 --json number,headRefOid,baseRefName --jq '.[] | "\(.number) \(.headRefOid) \(.baseRefName)"')"
          if [[ -z "${prs}" ]]; then
            echo 'No open release pull request to merge.'
            exit 0
          fi

          # Empty rather than [] when the file cannot be read, since nothing
          # here sets pipefail, so both mean release-please's defaults.
          sections="$(gh api "repos/${GH_REPO}/contents/release-please-config.json" --jq '.content' | base64 -d | jq -c '[.["changelog-sections"], (.packages // {} | .[]["changelog-sections"])] | map(select(. != null)) | flatten')" || sections=''
          if [[ -z "${sections}" || "${sections}" == '[]' ]]; then
            sections='[{"type":"feat"},{"type":"fix"},{"type":"perf"},{"type":"revert"},{"type":"chore","hidden":true},{"type":"docs","hidden":true},{"type":"style","hidden":true},{"type":"refactor","hidden":true},{"type":"test","hidden":true},{"type":"build","hidden":true},{"type":"ci","hidden":true}]'
          fi

          # Prints each commit, among those a compare returned, that the
          # changelog would list, and a line of its own when GitHub returned
          # fewer commits than landed, since the rest cannot be judged. The
          # dollar signs are jq's, so the quotes are single on purpose.
          # shellcheck disable=SC2016
          listed='
            ($sections | map(select(.hidden != true) | .type)) as $visible
            | ($sections | map(select(.hidden == true) | .type)) as $hidden
            | (if .total_commits > (.commits | length)
               then "\(.total_commits) commits landed, more than could be read"
               else empty end),
              (.commits[]
               | .sha[0:7] as $sha
               | (.commit.message | split("\n")) as $lines
               | ($lines | any(test("^BREAKING[ -]CHANGE: "))) as $footer
               | $lines[] as $line
               | ($line | capture("^(?<type>[A-Za-z]+)(\\([^()]*\\))?(?<bang>!)?: ")) as $header
               | select(($visible | index($header.type)) != null
                   or (($header.bang == "!" or $footer) and ($hidden | index($header.type)) != null))
               | "\($sha) \($line)")'

          while read -r pr head base; do
            # Checks are created a few seconds after a push, so a pull request
            # release-please has just rewritten can report none yet. Waiting
            # ends once every check has finished, or after a minute with none
            # at all; the merge is what enforces which ones had to pass.
            for attempt in {1..90}; do
              read -r total pending <<< "$(gh pr view "${pr}" --json statusCheckRollup --jq '[(.statusCheckRollup | length), ([.statusCheckRollup[] | select((.status // "COMPLETED") != "COMPLETED" or .state == "PENDING" or .state == "EXPECTED")] | length)] | join(" ")')"
              if (( total > 0 && pending == 0 )) || (( total == 0 && attempt >= 4 )); then
                break
              fi
              sleep 20
            done

            if ! computed="$(gh api "repos/${GH_REPO}/commits/${head}" --jq '.parents[0].sha')" ||
              ! compare="$(gh api "repos/${GH_REPO}/compare/${computed}...${base}")" ||
              ! landed="$(jq -r --argjson sections "${sections}" "${listed}" <<< "${compare}")"; then
              echo "::warning::Could not list what landed on ${base} since #${pr} was computed. Merge it by hand."
              continue
            fi
            if [[ -n "${landed}" ]]; then
              echo "::notice::Not merging #${pr}. It was computed before these landed on ${base}, and its changelog would list them. The next run merges it once their own run has rewritten it."
              echo "${landed}"
              continue
            fi

            merged=''
            for attempt in 1 2 3; do
              if result="$(gh api -X PUT "repos/${GH_REPO}/pulls/${pr}/merge" -f merge_method=squash -f sha="${head}" --jq '.message' 2>&1)"; then
                merged=yes
                echo "#${pr}: ${result}"
                break
              fi
              echo "#${pr} merge attempt ${attempt}: ${result}"
              sleep 10
            done
            if [[ -z "${merged}" ]]; then
              echo "::warning::Could not merge #${pr}. Merge it by hand."
            fi
          done <<< "${prs}"
