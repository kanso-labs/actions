name: Publish to npm

on:
  workflow_call:
    inputs:
      build-script:
        default: build
        description:
          npm script that produces what gets published. Pass an empty string for
          a package with nothing to build.
        required: false
        type: string
      dry-run:
        default: false
        description:
          Run everything up to and including npm publish --dry-run, which
          resolves the manifest and prints the file list without uploading
          anything. Exists so a caller can exercise this workflow on a pull
          request. Not something a publishing caller should set.
        required: false
        type: boolean
      github-registry-url:
        default: https://npm.pkg.github.com
        description:
          GitHub Packages registry the mirror job publishes to. Only the host is
          configurable — the scope is always the calling repository's owner,
          because that is the only scope this registry accepts.
        required: false
        type: string
      ignore-scripts:
        default: true
        description:
          Whether to pass --ignore-scripts to npm ci and to npm publish. True by
          default, which is the opposite of the composite action's default and
          deliberate — see README.md.
        required: false
        type: boolean
      node-version-file:
        default: .tool-versions
        description: File the Node version is read from.
        required: false
        type: string
      npm:
        default: true
        description:
          Whether to publish to the public registry at all. False for a package
          GitHub Packages alone carries, whose manifest points publishConfig
          there; the GitHub Packages job then runs on its own.
        required: false
        type: boolean
      registry-url:
        default: https://registry.npmjs.org
        description:
          Public registry the first job publishes to, written to a job-level
          .npmrc. Both jobs also install from it.
        required: false
        type: string
      runs-on:
        default: '"ubuntu-latest"'
        description:
          What the GitHub Packages job runs on, as JSON for fromJSON(), either
          one label as a string or an array of labels. The npm job always runs
          on ubuntu-latest, because npm's trusted publishing and provenance
          refuse a self-hosted runner.
        required: false
        type: string
      tag-name:
        default: ''
        description:
          Tag to publish. Defaults to the run's own ref when the run is on a
          tag, which is how a caller should run this, on release published. When
          there is a tag, both jobs refuse to publish unless the commit they
          checked out is the one the tag names and package.json carries the
          tag's version. Empty with no tag only for a dry run with no release
          behind it.
        required: false
        type: string

# Permissions are declared per job below rather than once for the file, and that
# is not tidiness — the two jobs must not hold each other's scope.
#
# npm decides whether to attempt an OIDC exchange by looking for the variables
# that id-token: write injects. GitHub Packages has no trusted publishing to
# exchange against, so granting that scope to the mirror job would invite npm to
# try something the registry cannot answer, during the publish half of a release
# that has already been tagged. It is granted where it is used and nowhere else.
#
# The fail-fast property the old file-level block bought is unchanged. A caller
# is checked against every job it starts, so one that forgets a scope still
# fails immediately with that scope named, rather than reaching a registry and
# being refused there for a reason that reads as a registry problem.

jobs:
  # The public registry, over trusted publishing, and the source of truth for
  # what a version of this package is. The mirror below runs after it, and only
  # if it succeeded — see the comment there.
  publish:
    name: Publish to npm
    if: inputs.npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Deliberately not this repository's setup-node, even though
      # these two steps are most of what it does.
      #
      # A local "./" reference inside a reusable workflow is resolved against
      # the checkout in the workspace, which belongs to the caller — so it would
      # look for the composite in the consuming repository and not find it.
      # GitHub documents "./" for referencing a workflow in the same repository
      # and says nothing either way about an action referenced from inside a
      # called workflow, and this is not a thing to rest on undocumented
      # behaviour: every consumer publishes through here.
      #
      # Naming the composite by tag instead — setup-node@v2.1.0 — would work,
      # but it pins this repository to a version of itself that does not exist
      # until the release that carries this file is cut, and silently publishes
      # the wrong thing if release-please ever computes a different number.
      #
      # What is lost by inlining is the cache handling, and this job turns that
      # off anyway: it installs once and throws the runner away, so restoring
      # the cache costs more than the one install it saves.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: ${{ inputs.registry-url }}

      # A caller runs this on release published, or by hand on a tag, so the
      # checkout above is the tag's own commit and GITHUB_SHA, which npm writes
      # into the provenance attestation, names the commit the tarball is built
      # from. release-please tags the release pull request's merge commit
      # whichever run cuts the release, so that holds however the release was
      # cut. kanso-labs/actions#123 is what publishing from the run that cut it
      # cost: a later run cut v0.14.0 of daily-core, its checkout was the later
      # commit, and nothing ever published it.
      #
      # This check is what keeps the older shape honest. A caller that still
      # calls this from its release-please run on main, with the tag-name that
      # run cut, can check out a later commit than the tag's, and publishing
      # then would ship that commit's code under the tagged version. Checking
      # out the tag instead would not be enough, because GITHUB_SHA would
      # still name the later commit. So it refuses, and the version is
      # published by running the caller on the tag.
      #
      # A real publish is always checked against a tag. With none given and
      # the run on a branch, which is a caller still on the older shape that
      # passes no tag-name, it checks against the tag package.json's version
      # would have, rather than publishing whatever commit the run is on. Only
      # a dry run goes unchecked.
      #
      # It also refuses a tag that is not on the default branch, which is what
      # a release made by hand in the UI on another branch looks like: it fires
      # the same release event as release-please's. This catches a mistake, not
      # a writer set on publishing a branch, who could edit the caller's own
      # workflow to publish directly. The default branch comes from the event,
      # or from the remote's HEAD on an event that carries no repository, and
      # its history is fetched for the check, unshallowing the checkout.
      #
      # The checkout is shallow and fetches no tags, so the tag is resolved on
      # the remote: the peeled commit for an annotated tag, the tag itself for
      # a lightweight one, which is what release-please creates. It runs after
      # Set up Node because it reads package.json with node, which a
      # self-hosted runner need not carry. The mirror job below runs the same
      # check at the same point, and tests/publish-npm-tag-check.test.mjs holds
      # the two copies equal.
      - name: Check this is the tagged commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry-run }}
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME:
            ${{ inputs.tag-name || (github.ref_type == 'tag' && github.ref_name)
            || '' }}
        run: |
          if [[ -z "${TAG_NAME}" ]]; then
            if [[ "${DRY_RUN}" == 'true' ]]; then
              echo 'No tag to check, which only a dry run may leave out.'
              exit 0
            fi
            TAG_NAME="v$(node -p 'require("./package.json").version')"
            echo "::warning::This run is not on a tag and was given no tag-name, so it checks against ${TAG_NAME}, the tag package.json's version would have."
          fi
          if [[ "${REF_TYPE}" != 'tag' ]]; then
            echo "::warning::Publishing ${TAG_NAME} from a run on a branch, which loses the publish whenever another run cuts the release (kanso-labs/actions#123). Run the caller on release published instead, as README.md in kanso-labs/actions shows."
          fi

          tagged="$(git ls-remote origin "refs/tags/${TAG_NAME}^{}" | cut -f1)"
          if [[ -z "${tagged}" ]]; then
            tagged="$(git ls-remote origin "refs/tags/${TAG_NAME}" | cut -f1)"
          fi
          if [[ -z "${tagged}" ]]; then
            echo "::error::Refusing to publish: origin has no tag ${TAG_NAME}."
            exit 1
          fi

          head="$(git rev-parse HEAD)"
          if [[ "${head}" != "${tagged}" ]]; then
            echo "::error::Refusing to publish: ${TAG_NAME} is at ${tagged}, but this run checked out ${head}."
            exit 1
          fi

          if [[ ! "${TAG_NAME}" =~ (^|-)v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::Refusing to publish: ${TAG_NAME} carries no version to compare."
            exit 1
          fi
          tag_version="${BASH_REMATCH[2]}"
          version="$(node -p 'require("./package.json").version')"
          if [[ "${version}" != "${tag_version}" ]]; then
            echo "::error::Refusing to publish: ${TAG_NAME} names ${tag_version}, but package.json carries ${version}."
            exit 1
          fi

          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            DEFAULT_BRANCH="$(git ls-remote --symref origin HEAD | sed -n 's|^ref: refs/heads/\(.*\)\tHEAD$|\1|p')"
          fi
          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            echo '::error::Refusing to publish: could not tell which branch is the default to check the tag against.'
            exit 1
          fi
          branch="refs/remotes/origin/${DEFAULT_BRANCH}"
          fetch=(git fetch --quiet --no-tags)
          if [[ "$(git rev-parse --is-shallow-repository)" == 'true' ]]; then
            fetch+=(--unshallow)
          fi
          "${fetch[@]}" origin "+refs/heads/${DEFAULT_BRANCH}:${branch}"
          if ! git merge-base --is-ancestor "${head}" "${branch}"; then
            echo "::error::Refusing to publish: ${TAG_NAME} is at ${head}, which is not on ${DEFAULT_BRANCH}. Only a release cut from ${DEFAULT_BRANCH} publishes."
            exit 1
          fi

          echo "Publishing ${version} from ${head}, the commit ${TAG_NAME} names."

      # What makes publishing a tag safe to repeat: a re-run, a second run on
      # the same tag, or a recovery started by hand when only one registry
      # caught the version. npm refuses to publish a version twice, so without
      # this a repeat fails rather than doing nothing. Everything after it is
      # skipped once the version is there.
      #
      # It asks the registry for the package's document rather than running
      # npm view, so it reads no .npmrc and needs neither gh nor jq on a
      # self-hosted runner. A 404 means the package does not exist yet, which
      # is an unpublished version too; any other failure stops the job, since
      # guessing either way is worse than a re-run. The mirror job carries the
      # same step against GitHub Packages, and
      # tests/publish-npm-already-published.test.mjs holds the two equal.
      - name: Check whether this version is already published
        id: published
        env:
          REGISTRY_TOKEN: ''
          REGISTRY_URL: ${{ inputs.registry-url }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'

          const { name, version } = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const registry = process.env.REGISTRY_URL.replace(/\/+$/, '')
          const headers = { accept: 'application/json', 'cache-control': 'no-cache' }
          if (process.env.REGISTRY_TOKEN)
            headers.authorization = `Bearer ${process.env.REGISTRY_TOKEN}`

          let response
          try {
            response = await fetch(`${registry}/${name.replace('/', '%2f')}`, { headers })
          } catch (error) {
            console.log(`::error::Could not ask ${registry} whether ${name}@${version} is published: ${error.message}`)
            process.exit(1)
          }

          let published = false
          let latest
          if (response.ok) {
            const document = await response.json()
            published = Object.hasOwn(document.versions ?? {}, version.split('+')[0])
            latest = document['dist-tags']?.latest
          } else if (response.status !== 404) {
            console.log(`::error::Could not ask ${registry} whether ${name}@${version} is published: HTTP ${response.status}.`)
            process.exit(1)
          }

          // npm publish moves latest unless told otherwise, so a prerelease
          // goes to next and a version older than latest, which is a recovery
          // after later releases, goes to backport. npm keeps no build
          // metadata, so the lookup above drops it.
          const core = (v) => v.split(/[-+]/)[0].split('.').map(Number)
          const older = (a, b) => {
            const [x, y] = [core(a), core(b)]
            const i = x.findIndex((part, n) => part !== y[n])
            return i !== -1 && x[i] < y[i]
          }
          let distTag = 'latest'
          if (/-/.test(version.split('+')[0])) distTag = 'next'
          else if (latest && older(version, latest)) distTag = 'backport'

          if (published)
            console.log(`::notice::${name}@${version} is already on ${registry}, so this job publishes nothing.`)
          else
            console.log(`${name}@${version} is not on ${registry} yet, and publishes under ${distTag}.`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\npublished=${published}\n`)
          EOF

      # npm ci takes the flag but not a value for it, so the two forms cannot be
      # collapsed into one interpolated command line.
      - name: Install dependencies
        if: inputs.dry-run || steps.published.outputs.published != 'true'
        env:
          IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        run: |
          if [[ "${IGNORE_SCRIPTS}" == 'true' ]]; then
            npm ci --ignore-scripts
          else
            npm ci
          fi

      - name: Run build
        if:
          inputs.build-script != '' && (inputs.dry-run ||
          steps.published.outputs.published != 'true')
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: npm run "${BUILD_SCRIPT}"

      # --ignore-scripts here is a different question from the one above, and
      # the answer happens to be the same. npm runs prepare on publish as well
      # as on install, so a package whose prepare script downloads a browser
      # would pay for it a second time here — as a step of the publish itself,
      # where failing to fetch something aborts a release that has already been
      # tagged. The build above is what produces the published files.
      #
      # Collected into an array rather than interpolated, because npm takes both
      # of these as flags and neither accepts a value.
      - name: Publish to npm
        if: inputs.dry-run || steps.published.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.published.outputs.dist-tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        run: |
          set -euo pipefail

          args=(--tag "${DIST_TAG:-latest}")
          if [[ "${IGNORE_SCRIPTS}" == 'true' ]]; then
            args+=(--ignore-scripts)
          fi
          if [[ "${DRY_RUN}" == 'true' ]]; then
            args+=(--dry-run)
          fi

          npm publish "${args[@]}"

  # The same tarball, pushed to GitHub Packages so the organization's own
  # registry carries every version the public one does.
  #
  # It repeats four steps rather than reusing the job above, because the two
  # differ in the one place that cannot be parameterised: their permissions. A
  # matrix would collapse the duplication and hand both legs the union of the
  # scopes, which is the thing the block above refuses to do. A second runner is
  # cheaper than that.
  #
  # needs: publish orders them, and the ordering is the point rather than a side
  # effect. npm is the source of truth; this is the mirror. If the public
  # publish fails, both registries stay one version behind, and the next release
  # — or re-running this job on its own — catches them up together. Without the
  # edge, a failed npm publish would leave GitHub Packages serving a version
  # npmjs.com has never heard of, which is the one state a version number cannot
  # be reasoned about from.
  #
  # The one exception is a caller passing npm: false, for a package GitHub
  # Packages alone carries. The job above is then skipped, and a skipped need
  # fails the default success() check, so the condition says which skip is
  # allowed rather than accepting any.
  publish-github-packages:
    name: Publish to GitHub Packages
    needs: publish
    if:
      ${{ !cancelled() && (needs.publish.result == 'success' || (!inputs.npm &&
      needs.publish.result == 'skipped')) }}
    permissions:
      contents: read
      packages: write
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Points at the public registry and not at GitHub Packages, which is the
      # trap this job is built around rather than an oversight.
      #
      # Given a GitHub Packages registry-url, actions/setup-node writes a scoped
      # line — @kanso-labs:registry=https://npm.pkg.github.com/ — because that
      # registry serves one scope only. The line governs installs as much as
      # publishes, so npm ci below would go looking for every @kanso-labs
      # dependency there. A consumer that devDepends on another @kanso-labs
      # package — pinned to a version that predates this job, and that GitHub
      # Packages will therefore never carry — would 404 on the install and
      # half-land the release.
      #
      # So: install and build against the same registry the job above uses, and
      # repoint npm afterwards, once there is nothing left to resolve.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: ${{ inputs.registry-url }}

      # The same check as the job above, for the same reason. needs: publish
      # already keeps a refused publish from reaching here, but this job is
      # what re-running it alone runs, so it checks again rather than trust it.
      - name: Check this is the tagged commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry-run }}
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME:
            ${{ inputs.tag-name || (github.ref_type == 'tag' && github.ref_name)
            || '' }}
        run: |
          if [[ -z "${TAG_NAME}" ]]; then
            if [[ "${DRY_RUN}" == 'true' ]]; then
              echo 'No tag to check, which only a dry run may leave out.'
              exit 0
            fi
            TAG_NAME="v$(node -p 'require("./package.json").version')"
            echo "::warning::This run is not on a tag and was given no tag-name, so it checks against ${TAG_NAME}, the tag package.json's version would have."
          fi
          if [[ "${REF_TYPE}" != 'tag' ]]; then
            echo "::warning::Publishing ${TAG_NAME} from a run on a branch, which loses the publish whenever another run cuts the release (kanso-labs/actions#123). Run the caller on release published instead, as README.md in kanso-labs/actions shows."
          fi

          tagged="$(git ls-remote origin "refs/tags/${TAG_NAME}^{}" | cut -f1)"
          if [[ -z "${tagged}" ]]; then
            tagged="$(git ls-remote origin "refs/tags/${TAG_NAME}" | cut -f1)"
          fi
          if [[ -z "${tagged}" ]]; then
            echo "::error::Refusing to publish: origin has no tag ${TAG_NAME}."
            exit 1
          fi

          head="$(git rev-parse HEAD)"
          if [[ "${head}" != "${tagged}" ]]; then
            echo "::error::Refusing to publish: ${TAG_NAME} is at ${tagged}, but this run checked out ${head}."
            exit 1
          fi

          if [[ ! "${TAG_NAME}" =~ (^|-)v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::Refusing to publish: ${TAG_NAME} carries no version to compare."
            exit 1
          fi
          tag_version="${BASH_REMATCH[2]}"
          version="$(node -p 'require("./package.json").version')"
          if [[ "${version}" != "${tag_version}" ]]; then
            echo "::error::Refusing to publish: ${TAG_NAME} names ${tag_version}, but package.json carries ${version}."
            exit 1
          fi

          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            DEFAULT_BRANCH="$(git ls-remote --symref origin HEAD | sed -n 's|^ref: refs/heads/\(.*\)\tHEAD$|\1|p')"
          fi
          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            echo '::error::Refusing to publish: could not tell which branch is the default to check the tag against.'
            exit 1
          fi
          branch="refs/remotes/origin/${DEFAULT_BRANCH}"
          fetch=(git fetch --quiet --no-tags)
          if [[ "$(git rev-parse --is-shallow-repository)" == 'true' ]]; then
            fetch+=(--unshallow)
          fi
          "${fetch[@]}" origin "+refs/heads/${DEFAULT_BRANCH}:${branch}"
          if ! git merge-base --is-ancestor "${head}" "${branch}"; then
            echo "::error::Refusing to publish: ${TAG_NAME} is at ${head}, which is not on ${DEFAULT_BRANCH}. Only a release cut from ${DEFAULT_BRANCH} publishes."
            exit 1
          fi

          echo "Publishing ${version} from ${head}, the commit ${TAG_NAME} names."

      # The same check as the job above, against GitHub Packages, which
      # answers only with a token. It is what lets a recovery fill in this
      # registry alone when npm already has the version.
      - name: Check whether this version is already published
        id: published
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_URL: ${{ inputs.github-registry-url }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'

          const { name, version } = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const registry = process.env.REGISTRY_URL.replace(/\/+$/, '')
          const headers = { accept: 'application/json', 'cache-control': 'no-cache' }
          if (process.env.REGISTRY_TOKEN)
            headers.authorization = `Bearer ${process.env.REGISTRY_TOKEN}`

          let response
          try {
            response = await fetch(`${registry}/${name.replace('/', '%2f')}`, { headers })
          } catch (error) {
            console.log(`::error::Could not ask ${registry} whether ${name}@${version} is published: ${error.message}`)
            process.exit(1)
          }

          let published = false
          let latest
          if (response.ok) {
            const document = await response.json()
            published = Object.hasOwn(document.versions ?? {}, version.split('+')[0])
            latest = document['dist-tags']?.latest
          } else if (response.status !== 404) {
            console.log(`::error::Could not ask ${registry} whether ${name}@${version} is published: HTTP ${response.status}.`)
            process.exit(1)
          }

          // npm publish moves latest unless told otherwise, so a prerelease
          // goes to next and a version older than latest, which is a recovery
          // after later releases, goes to backport. npm keeps no build
          // metadata, so the lookup above drops it.
          const core = (v) => v.split(/[-+]/)[0].split('.').map(Number)
          const older = (a, b) => {
            const [x, y] = [core(a), core(b)]
            const i = x.findIndex((part, n) => part !== y[n])
            return i !== -1 && x[i] < y[i]
          }
          let distTag = 'latest'
          if (/-/.test(version.split('+')[0])) distTag = 'next'
          else if (latest && older(version, latest)) distTag = 'backport'

          if (published)
            console.log(`::notice::${name}@${version} is already on ${registry}, so this job publishes nothing.`)
          else
            console.log(`${name}@${version} is not on ${registry} yet, and publishes under ${distTag}.`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\npublished=${published}\n`)
          EOF

      - name: Install dependencies
        if: inputs.dry-run || steps.published.outputs.published != 'true'
        env:
          IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        run: |
          if [[ "${IGNORE_SCRIPTS}" == 'true' ]]; then
            npm ci --ignore-scripts
          else
            npm ci
          fi

      - name: Run build
        if:
          inputs.build-script != '' && (inputs.dry-run ||
          steps.published.outputs.published != 'true')
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: npm run "${BUILD_SCRIPT}"

      # Calling actions/setup-node a second time is how the .npmrc gets
      # rewritten, rather than appending to that file by hand. Writing it is the
      # action's job, and reaching for NPM_CONFIG_USERCONFIG to find where it
      # put the file would rest on an internal of the action.
      #
      # It appends rather than replaces. The action drops only those lines
      # starting with the registry key it is about to write, and here that key
      # is scoped — @kanso-labs:registry — which the unscoped registry= line
      # from the first call does not match. So both survive: registry= still
      # names the public one, and only this single scope is redirected.
      #
      # Which also means NODE_AUTH_TOKEN below is substituted into the auth line
      # of both registries. Publishing a scoped package only ever contacts the
      # registry for that scope, so the token is not in fact sent to npmjs.com —
      # and it is a run-scoped token either way.
      #
      # scope is stated rather than left to default. The action does default it
      # to the repository owner for a npm.pkg.github.com URL, and inside a
      # called workflow the github context belongs to the caller, so the default
      # would land on this same value. Saying it costs one line and means a
      # publish's correctness does not turn on which repository a context is
      # read from.
      - name: Point npm at GitHub Packages
        if: inputs.dry-run || steps.published.outputs.published != 'true'
        uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: ${{ inputs.github-registry-url }}
          scope: ${{ github.repository_owner }}

      # NODE_AUTH_TOKEN belongs to this step rather than to the job, so it
      # exists for exactly the request that needs it. GitHub Packages has no
      # trusted publishing: GITHUB_TOKEN plus packages: write is the whole of
      # the authentication, and it expires with the run.
      #
      # Nothing attested comes out of here. Provenance is minted during the OIDC
      # exchange, which is the job above's business — this is the same tarball,
      # attested in the place where attestation is possible.
      - name: Publish to GitHub Packages
        if: inputs.dry-run || steps.published.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.published.outputs.dist-tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(--tag "${DIST_TAG:-latest}")
          if [[ "${IGNORE_SCRIPTS}" == 'true' ]]; then
            args+=(--ignore-scripts)
          fi
          if [[ "${DRY_RUN}" == 'true' ]]; then
            args+=(--dry-run)
          fi

          npm publish "${args[@]}"
