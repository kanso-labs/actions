name: Test

on:
  pull_request:
    branches:
      - main
  # The push is for the coverage report. A pull request's coverage is compared
  # with the report uploaded for the head of main, so without one there is
  # nothing for a drop to be measured against.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # upstream-changelog has enough logic of its own to be worth unit testing,
  # and is the only composite action that cannot be smoke tested the way the
  # other two are: a live run needs an open Renovate pull request carrying
  # release notes, which exists in a consumer and not here. The tests stand in
  # for that, over a body in Renovate's own layout.
  #
  # What they cannot cover is release-please agreeing with the block they
  # check. That part is in the action's README, as a recipe to run by hand.
  #
  # The release merge in _release-please.yaml is tested here for a similar
  # reason: what it decides from, a commit landing while a release pull request
  # waits or GitHub refusing a merge, cannot be arranged on a pull request, so
  # its script runs against a stand-in gh instead. Its step that sets released
  # issues back to Done runs against a stand-in github-script, since it acts on
  # a release pull request linking itself to issues closed long before and
  # writes to organization projects, neither of which a pull request here may
  # arrange. _publish-npm.yaml's tag check
  # is too, because the release it refuses, one cut by a later run than the
  # merge commit's own, cannot be produced on a pull request. So is
  # _sync-labels.yaml's script, because a live run rewrites the labels of
  # whichever repository runs it, which here would be this one on every push.
  test:
    name: Test
    runs-on: ubuntu-latest
    # Only this job writes: the upload below needs code-quality, and nothing
    # else in this workflow should hold it.
    permissions:
      code-quality: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: ./setup-node

      - name: Run the unit tests
        run: npm run test:coverage

      # Coverage counts upstream-changelog.mjs alone, which is the only source
      # file here. `test:coverage` names it with --include and --all so that it
      # is counted as zero if no test ever loads it, rather than missing from
      # the total. The tests under tests/ cut a script out of a workflow and
      # run it with a stand-in gh, so the shell and github-script they cover
      # has no file for a report to point at.
      #
      # c8 rather than `node --test --experimental-test-coverage`, because the
      # action takes a Cobertura file and Node's built-in reporters write only
      # lcov and its own table.
      #
      # fail-on-error is false because the action defaults it to true, and
      # waits for GitHub to process the report, which is a public preview
      # service. An outage there should not turn a green test run red. The
      # error is still annotated either way; a missing report or an invalid
      # input still fails the step.
      - name: Upload coverage report
        uses: actions/upload-code-coverage@v1.4.4
        with:
          fail-on-error: false
          file: coverage/cobertura-coverage.xml
          label: code-coverage/c8
          language: JavaScript

  # _release-please.yaml is the one thing here that nothing exercised. The
  # composite action has a live smoke test in lint.yaml, but this workflow only
  # ever runs on a push to a default branch, so the two actions it pins —
  # release-please-action and create-github-app-token — reached main having
  # never been started, and then ran for real in four repositories at once.
  #
  # This calls it in dry-run, where release-please still resolves the config,
  # walks the commits and computes versions, but opens no pull request and cuts
  # no release. No secrets are passed, so it also covers the GITHUB_TOKEN
  # fallback path and the warning that goes with it.
  #
  # Referenced by path, which is what runs the version in the pull request —
  # the only version that matters here, because the point is to fail before the
  # merge rather than after it. release-please.yaml reaches the same workflow
  # the same way; it used to pin a tag, and the comment there says why it does
  # not any more.
  release-please:
    name: Dry run release-please
    # Not on a push: release-please.yaml runs the real thing there.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/_release-please.yaml
    with:
      dry-run: true
      # The array a runner picker hands on, where the default is a string, so
      # the job's fromJSON() meets both shapes.
      runs-on: '["ubuntu-latest"]'
