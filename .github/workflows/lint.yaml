name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Also the smoke test for lint-workflows, the same way check-formatting
  # below is the one for setup-node. It is the only place in this
  # repository that runs it, so a change breaking the action fails here rather
  # than in whichever repository next pins a new version. Do not "tidy" it into
  # a plain raven-actions/actionlint step.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: ./lint-workflows

  # This job is also the smoke test for setup-node. It is the only
  # place in this repository that runs it, and a change breaking the action
  # fails here rather than in whichever repository next pins a new version.
  check-formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: ./setup-node

      - name: Check formatting
        run: npm run lint
